<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OG Image Preview - China Hospitals Guide</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }
    .og-image {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
    }
    .og-image::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 800px;
      height: 800px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .og-image::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 600px;
      height: 600px;
      background: rgba(255,255,255,0.03);
      border-radius: 50%;
    }
    .logo-area {
      position: absolute;
      top: 40px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }
    .logo-icon {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .logo-text {
      color: white;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .main-content {
      text-align: center;
      z-index: 10;
      max-width: 900px;
    }
    .headline {
      color: white;
      font-size: 72px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 30px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .subheadline {
      color: rgba(255,255,255,0.95);
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 50px;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-top: 20px;
    }
    .stat-item {
      text-align: center;
      color: white;
    }
    .stat-number {
      font-size: 48px;
      font-weight: 800;
      display: block;
    }
    .stat-label {
      font-size: 18px;
      opacity: 0.9;
      margin-top: 5px;
    }
    .cta-badge {
      position: absolute;
      bottom: 50px;
      right: 60px;
      background: #ff6b6b;
      color: white;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255,107,107,0.4);
      z-index: 10;
    }
    .medical-icons {
      position: absolute;
      top: 40px;
      right: 60px;
      display: flex;
      gap: 20px;
      z-index: 10;
    }
    .medical-icon {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="og-image">
    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-icon">🏥</div>
      <div class="logo-text">China Hospitals Guide</div>
    </div>

    <!-- Medical Icons -->
    <div class="medical-icons">
      <div class="medical-icon">❤️</div>
      <div class="medical-icon">🩺</div>
      <div class="medical-icon">✈️</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h1 class="headline">World-Class Healthcare<br>at 50-80% Lower Costs</h1>
      <p class="subheadline">Your trusted guide to top hospitals in Beijing, Shanghai, Guangzhou & Shenzhen</p>
      
      <!-- Stats -->
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-number">40+</span>
          <div class="stat-label">Partner Hospitals</div>
        </div>
        <div class="stat-item">
          <span class="stat-number">500+</span>
          <div class="stat-label">Patients Helped</div>
        </div>
        <div class="stat-item">
          <span class="stat-number">98%</span>
          <div class="stat-label">Satisfaction Rate</div>
        </div>
      </div>
    </div>

    <!-- CTA Badge -->
    <div class="cta-badge">🛡️ 100% Satisfaction Guarantee</div>
  </div>
</body>
</html>
